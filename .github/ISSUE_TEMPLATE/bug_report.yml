name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: DivGrid and macOS versions
      placeholder: "DivGrid 0.1.0, macOS 26.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Output of `log show --last 5m --predicate 'subsystem == \"studio.g6.divgrid\"'`"
      render: shell
